buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath('com.google.gms:google-services:4.4.4')
        // Crashlytics Gradle plugin. Required for native (JVM + NDK) crash
        // reporting and for uploading the mapping file — without it a release
        // build's stack traces arrive obfuscated and are unreadable.
        classpath('com.google.firebase:firebase-crashlytics-gradle:3.0.8')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
